<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стив Рембо и его игровые сервера</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="index">

<div class="container">
    <header class="site-header">
        <h1>Стив Рембо и его игровые сервера</h1>

        <nav class="site-nav" data-role="site-nav" aria-label="Основная навигация"></nav>
    </header>

    <main>
        <section class="game-grid" data-role="game-grid" aria-label="Список игровых серверов"></section>

        <noscript>
            <p class="note">Для отображения списка игр включите JavaScript.</p>
        </noscript>
    </main>

    <footer class="site-footer" data-role="site-footer"></footer>
</div>

<!-- Шаблон карточки игры на главной -->
<template id="game-card-template">
    <article class="game-card">
        <span class="status-badge" data-role="card-status"></span>
        <h2><a data-role="card-link"></a></h2>
        <p class="placeholder" data-role="card-description"></p>
        <a class="button" data-role="card-button">Подробнее →</a>
    </article>
</template>

<script src="data/games.js" defer></script>
<script src="js/footer.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
